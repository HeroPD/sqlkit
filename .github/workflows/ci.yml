name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run of the same event type and ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    env:
      # Activates the *.integration.test.ts suites against the services below;
      # without these they self-skip. Values match the service envs.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/testsqlkit?sslmode=disable
      TEST_MYSQL_URL: mysql://root:root@localhost:3306/testsqlkit
      TEST_MSSQL_URL: mssql://sa:CIpassword123!@localhost:1433/master
      # Same Postgres through PgBouncer in transaction pooling mode: covers the
      # wire-protocol cancel path, which pg_cancel_backend cannot reach.
      TEST_POOLED_DATABASE_URL: postgres://postgres:postgres@localhost:6432/testsqlkit?sslmode=disable

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testsqlkit
        ports:
          - 5432:5432
        # Hold the job's steps until Postgres is accepting connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pgbouncer:
        image: edoburu/pgbouncer:latest
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: testsqlkit
          POOL_MODE: transaction
          AUTH_TYPE: plain
          LISTEN_PORT: 6432
        ports:
          - 6432:6432
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testsqlkit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CIpassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CIpassword123!' -C -Q 'select 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # node:sqlite is unflagged only from Node 24; sqlite tests import it directly.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      # vitest run — unit tests plus the Postgres integration suites (TEST_DATABASE_URL is set).
      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build


  package:
    name: Package (${{ matrix.platform }})
    # Packaging is intentionally opt-in because the cross-platform matrix is
    # comparatively expensive. Run it from GitHub Actions via "Run workflow".
    if: github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: npx electron-builder --linux dir --x64 --publish never
          - os: macos-latest
            platform: mac
            command: npx electron-builder --mac dir --x64 --arm64 --publish never
          - os: windows-latest
            platform: windows
            command: npx electron-builder --win dir --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build unpacked application
        run: ${{ matrix.command }}
      - name: Launch packaged renderer
        if: matrix.platform == 'linux'
        run: xvfb-run -a release/linux-unpacked/sqlkit --smoke-test

  mariadb:
    name: MariaDB compatibility
    runs-on: ubuntu-latest
    env:
      TEST_MYSQL_URL: mysql://root:root@localhost:3306/testsqlkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Service containers cannot pass arguments to mariadbd. Start it directly
      # so the suite also covers SqlKit attribution via connection attributes.
      - name: Start MariaDB with Performance Schema
        run: |
          docker run --detach --name sqlkit-mariadb \
            --env MARIADB_ROOT_PASSWORD=root \
            --env MARIADB_DATABASE=testsqlkit \
            --publish 3306:3306 \
            --health-cmd "healthcheck.sh --connect --innodb_initialized" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            mariadb:11 --performance-schema=ON
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' sqlkit-mariadb)"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs sqlkit-mariadb
              exit 1
            fi
            sleep 2
          done
          docker logs sqlkit-mariadb
          exit 1
      - run: npm ci
      - name: MySQL driver suite against MariaDB
        run: npx vitest run electron/db/mysql.integration.test.ts
