appId: com.sqlkitapp.sqlkitstudio
productName: SqlKit Studio

directories:
  output: release
  buildResources: build

# ssh2 pulls optional cpu-features, a native optimization addon that does not
# build against Electron 42's V8 headers. ssh2 catches its absence/failure, and
# the app's required runtime deps are pure JS, so skip native rebuilds.
npmRebuild: false

# Only the compiled output goes into the asar. Renderer dependencies (lit)
# are bundled by Vite, so they live in devDependencies and are not packed.
files:
  - dist/**
  - dist-electron/**

# A release binary must not be inspectable: the main process decrypts saved
# database passwords into memory. These are baked into the binary, so unlike the
# argv checks in electron/hardening.ts they cannot be worked around by a flag.
# The app spawns its SQLite worker with utilityProcess.fork, not
# ELECTRON_RUN_AS_NODE, so disabling runAsNode costs nothing.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true

# Strip Chromium locale files for languages the app does not ship.
electronLanguages:
  - en
  - en-US

# bzip2 compresses the dmg better than the default lzfse, at the cost of a
# slower build and slower mount on first open.
dmg:
  format: UDBZ

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - nsis

linux:
  target:
    - AppImage
  category: Development
